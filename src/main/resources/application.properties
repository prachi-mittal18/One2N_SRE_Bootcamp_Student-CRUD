spring.application.name=One2N_SRE_Bootcamp
server.port=8085

# Postgresql Database Configuration
spring.datasource.driverClassName=${DB_DRIVER:org.postgresql.Driver}

# Read configurations from system Environment Variables with a fallback default value
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studentdb}
spring.datasource.username=${DB_USERNAME:student}
spring.datasource.password=${DB_PASSWORD:student}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# Enable H2 Console to view tables via browser
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true


