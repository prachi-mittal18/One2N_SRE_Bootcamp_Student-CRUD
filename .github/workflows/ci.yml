# workflow_dispatch: GitHub Actions trigger type specifically for manual runs.
name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  build-test-lint-publish:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API
        run: make build

      - name: Start database
        run: make db-migrate

      - name: Run tests
        run: make test

      - name: Perform code linting
        run: make lint

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker build and push
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_VERSION: ${{ github.sha }}
        run: |
          make docker-build IMAGE_NAME=$DOCKERHUB_USER/student-crud-api VERSION=$IMAGE_VERSION
          make docker-push IMAGE_NAME=$DOCKERHUB_USER/student-crud-api VERSION=$IMAGE_VERSION

      - name: Stop database
        if: always()
        run: make compose-stop